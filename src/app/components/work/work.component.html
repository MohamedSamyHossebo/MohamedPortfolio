<div id="work" class="work-section container mt-32 flex justify-between items-center mx-auto px-8 md:px-14 lg:px-24 w-full">
  <section class="w-full">
    <div class="work-header">
      <h2 class="secondary-title">My Work</h2>
      <p class="section-paragraph">
        I’ve had working and implementing frontend code of these projects below.
      </p>
    </div>

    <div class="projects-grid projects grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-12">
      @for (project of projects; track project) {
        <a class="project-card group relative block overflow-hidden rounded-xl bg-input/50 backdrop-blur-sm border border-white/10 transition-all duration-500 hover:shadow-glow lg:hover:scale-105 hover:border-theme/50"
          [href]="project.url" target="_blank" rel="noopener noreferrer"
          [attr.aria-label]="'View project: ' + project.name">
          <div class="aspect-video overflow-hidden">
            <img loading="lazy" [alt]="project.name" [src]="project.image"
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
            </div>
            <div class="p-6 border-t border-white/5">
              <h3 class="text-lg font-light text-center group-hover:text-selected-text transition-colors duration-300">{{ project.name }}</h3>
            </div>
            <div class="absolute inset-0 border-2 border-transparent group-hover:border-theme/30 rounded-xl pointer-events-none transition-colors duration-300"></div>
          </a>
        }
      </div>
    </section>
  </div>
